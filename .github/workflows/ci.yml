name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - run: pip install -r apps/api/requirements-dev.lock && pip install --no-deps -e apps/api
      - run: ruff check apps/api tests
      - run: mypy --config-file apps/api/pyproject.toml apps/api/app
      - run: pytest apps/api/tests tests infrastructure/tests -q
      - run: python -m app.evaluation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-results
          path: artifacts/evaluation*.json
          if-no-files-found: ignore
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: apps/web/test-results
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: enterpriseflow
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U postgres'
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd 'redis-cli ping'
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci-local-only@localhost:5432/enterpriseflow
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-local-only@localhost:5432/enterpriseflow
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test
      JOBS_EAGER: 'true'
      STORAGE_BACKEND: local
      ENABLE_FAKE_PROVIDER: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r apps/api/requirements-dev.lock && pip install --no-deps -e apps/api
      - name: Validate reversible migrations
        working-directory: apps/api
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - run: pytest tests/integration apps/api/tests/test_security.py -q
  live-compose-e2e:
    needs: [python, frontend, postgres-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      # Build the shared API image once; keep Go/Next/Python builds from
      # competing for memory on the standard hosted runner.
      COMPOSE_PARALLEL_LIMIT: '1'
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      LIVE_E2E: 'true'
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: docker/setup-buildx-action@v3
      - name: Prepare local synthetic environment
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build one image per component
        timeout-minutes: 25
        run: docker compose build backend frontend minio
      - name: Install browser dependencies
        timeout-minutes: 8
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start and seed real services
        timeout-minutes: 10
        run: |
          docker compose up --no-build --wait --wait-timeout 420
          docker compose run --rm --no-deps migrate python -m app.seed
      - name: Exercise real identity, isolation, approvals, and provider failures
        timeout-minutes: 16
        working-directory: apps/web
        run: npm run test:e2e
      - name: Collect sanitized service diagnostics
        if: always()
        timeout-minutes: 2
        run: python3 infrastructure/collect_compose_diagnostics.py
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 2
        with:
          name: live-compose-diagnostics
          path: |
            artifacts/live-compose/
            apps/web/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove the disposable CI stack
        if: always()
        timeout-minutes: 2
        run: docker compose down --volumes --remove-orphans
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'
      - run: ENV_FILE=.env.example docker compose --env-file .env.example config --quiet
      - run: terraform -chdir=infrastructure/terraform fmt -check -recursive
      - run: terraform -chdir=infrastructure/terraform init -backend=false
      - run: terraform -chdir=infrastructure/terraform validate
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/web.Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r apps/api/requirements-dev.lock && pip install --no-deps -e apps/api
      - run: pip-audit --skip-editable
      - run: npm ci && npm audit --omit=dev --audit-level=high
        working-directory: apps/web
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: '1'
          severity: HIGH,CRITICAL
