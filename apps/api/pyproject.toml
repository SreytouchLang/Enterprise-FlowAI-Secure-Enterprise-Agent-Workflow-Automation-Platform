[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterpriseflow-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3", "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.13,<2",
  "redis>=5,<7", "celery>=5.4,<6", "httpx>=0.27,<1",
  "PyJWT[crypto]>=2.9,<3", "cryptography>=44", "python-multipart>=0.0.20",
  "boto3>=1.35,<2", "pypdf>=5,<7", "python-docx>=1.1,<2",
  "pgvector>=0.3,<1", "openai>=1.68,<3", "anthropic>=0.49,<1",
  "langchain-core>=0.3,<2", "langgraph>=0.3,<2",
  "langgraph-checkpoint-sqlite>=2,<4", "langgraph-checkpoint-postgres>=2,<4",
  "prometheus-client>=0.21,<1", "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2", "opentelemetry-instrumentation-fastapi>=0.51b0",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.17.2,<1", "mypy>=1.14,<2", "pip-audit>=2.8,<3", "reportlab>=4,<5"]
rerank = ["sentence-transformers>=3,<6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.setuptools.packages.find]
include = ["app*"]
